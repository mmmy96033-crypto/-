<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صلى على النبي</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<meta property="og:type" content="website">
<meta property="og:title" content="صلى على النبي">
<meta property="og:description" content="اللهم صل وسلم على سيدنا محمد">
<meta property="og:image" content="https://i.supaimg.com/965e0c3e-50d9-4ba0-97dc-487d00fde583/1b422294-6664-4d9a-9802-aa33ab325eec.jpg">
<meta property="og:url" content="https://موقعك.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://i.supaimg.com/965e0c3e-50d9-4ba0-97dc-487d00fde583/1b422294-6664-4d9a-9802-aa33ab325eec.jpg">
<style>
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 50% 38%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 45%),
    radial-gradient(circle at 12% 10%,rgba(150,195,245,.55) 0,transparent 36%),
    radial-gradient(circle at 92% 88%,rgba(140,185,240,.50) 0,transparent 40%),
    radial-gradient(circle at 90% 8%,rgba(190,218,250,.45) 0,transparent 26%),
    radial-gradient(circle at 6% 92%,rgba(190,218,250,.40) 0,transparent 24%),
    #e9e6de;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
body::before{ /* fine dot pattern */
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(60,100,170,.13) 1.2px,transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,transparent 25%,#000 85%);
          mask-image:radial-gradient(circle at 50% 45%,transparent 25%,#000 85%);
}
.ring{position:fixed;border-radius:50%;pointer-events:none;border:2px solid rgba(110,160,225,.38)}
.r1{width:78vmin;height:78vmin;top:-26vmin;left:-26vmin}
.r2{width:100vmin;height:100vmin;bottom:-42vmin;right:-34vmin}
.r3{width:34vmin;height:34vmin;top:10vmin;right:6vmin;border-style:dashed;animation:spin 60s linear infinite}
.r4{width:20vmin;height:20vmin;bottom:14vmin;left:7vmin;background:rgba(150,195,245,.25);border:none}
@keyframes spin{to{transform:rotate(360deg)}}
svg{width:min(440px,90vw);height:auto;max-height:96vh;overflow:visible;position:relative}
text{font-family:"Reem Kufi","Noto Kufi Arabic","Segoe UI",sans-serif;font-weight:600}
@media (prefers-reduced-motion:reduce){.r3{animation:none}}
</style>
</head>
<body>
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>

<svg viewBox="0 0 460 800" aria-label="صلى على النبي">
  <defs>
    <linearGradient id="pole" x1="0" x2="1">
      <stop offset="0" stop-color="#6f757f"/><stop offset=".35" stop-color="#e3e6ea"/><stop offset=".65" stop-color="#b9bec6"/><stop offset="1" stop-color="#666c76"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cfdb"/><stop offset=".25" stop-color="#d9dde6"/><stop offset="1" stop-color="#e9e6de" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1c2748" stop-opacity=".45"/><stop offset="1" stop-color="#1c2748" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#5069c0"/><stop offset=".6" stop-color="#32499b"/><stop offset="1" stop-color="#26397f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e4e7ee"/><stop offset="1" stop-color="#b9bfcd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9cc4f5" stop-opacity=".55"/><stop offset="1" stop-color="#9cc4f5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="face"><circle cx="230" cy="230" r="192"/></clipPath>

    <!-- one arrow: tapered tail, wide head -->
    <path id="arrow" d="M156.22 -38.95 A161 161 0 0 0 -5.62 -160.9 L-6 -171.9 L-45.21 -148.51 L-4.47 -127.92 L-4.85 -138.92 A139 139 0 0 1 134.87 -33.63 Z" fill="#f5f7fc" stroke="#f5f7fc" stroke-width="1" stroke-linejoin="round"/>
  </defs>

  <!-- ground -->
  <rect x="-400" y="742" width="1260" height="260" fill="url(#ground)"/>
  <rect x="-400" y="741" width="1260" height="2" fill="#aab2c4" opacity=".7"/>
  <ellipse cx="230" cy="745" rx="95" ry="14" fill="url(#shadow)"/>

  <!-- pole + base plate + footing (touching the ground) -->
  <rect x="215" y="430" width="30" height="312" rx="3" fill="url(#pole)"/>
  <rect x="215" y="430" width="30" height="30" fill="#1c2748" opacity=".16"/>
  <path d="M196 742 L204 724 H256 L264 742 Z" fill="#8a909b"/>
  <rect x="196" y="740" width="68" height="5" rx="2" fill="#6b717c"/>
  <rect x="212" y="722" width="36" height="4" rx="2" fill="#9aa0ab"/>

  <!-- halo behind sign -->
  <circle cx="230" cy="230" r="300" fill="url(#halo)"/>

  <!-- clamps joining pole to sign -->
  <rect x="211" y="440" width="38" height="9" rx="2" fill="#7b818c"/>
  <rect x="211" y="468" width="38" height="9" rx="2" fill="#7b818c"/>

  <!-- sign -->
  <circle cx="230" cy="236" r="215" fill="#1c2748" opacity=".18"/>
  <circle cx="230" cy="230" r="215" fill="url(#rim)" stroke="#8f97ab" stroke-width="3"/>
  <circle cx="230" cy="230" r="207" fill="none" stroke="#aeb5c6" stroke-width="1.5" stroke-dasharray="46 8 16 24 62 10"/>
  <circle cx="230" cy="230" r="194" fill="#d3d8e3"/>
  <circle cx="230" cy="230" r="192" fill="url(#blue)"/>

  <g clip-path="url(#face)">
    <!-- arrows rotate counter-clockwise -->
    <g transform="translate(230 230)">
      <g>
        <use href="#arrow"/>
        <use href="#arrow" transform="rotate(120)"/>
        <use href="#arrow" transform="rotate(240)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- glossy sheen -->
    <ellipse cx="170" cy="120" rx="150" ry="95" fill="url(#sheen)" transform="rotate(-30 170 120)"/>
  </g>

  <!-- text: centered on the sign, with clear space between the two lines -->
  <g text-anchor="middle" fill="#f5f7fc">
    <text x="230" y="214" font-size="40">صلى</text>
    <text x="230" y="264" font-size="40">على النبي</text>
  </g>
</svg>
</body>
</html>
